<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#09090b;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <!-- Background Gradients & Glows -->
    <radialGradient id="glowTopLeft" cx="15%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBottomRight" cx="85%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0e0e11" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background base and glows -->
  <rect width="1200" height="630" fill="#09090b" />
  <rect width="1200" height="630" fill="url(#glowTopLeft)" />
  <rect width="1200" height="630" fill="url(#glowCenter)" />
  <rect width="1200" height="630" fill="url(#glowBottomRight)" />

  <!-- Subtle grid pattern -->
  <g stroke="#27272a" stroke-width="1" opacity="0.25">
    <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200 M0 350 H1200 M0 420 H1200 M0 490 H1200 M0 560 H1200" />
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630" />
  </g>

  <!-- Main Container Card / Border -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#27272a" stroke-width="2" />

  <!-- Header / Badge -->
  <g transform="translate(80, 80)">
    <!-- Logo Icon Box -->
    <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />
    <rect x="2" y="2" width="60" height="60" rx="14" fill="#0e0e11" />
    <!-- Flame Icon -->
    <path d="M32 16c0 6-6 9-6 15 0 6 4 11 10 11s10-5 10-11c0-4-3-8-4-10 4 2 8 6 8 11 0 8-6 15-14 15s-14-7-14-15c0-7 6-12 10-16z" fill="#f59e0b" />
    
    <!-- Title & Brand -->
    <text x="80" y="42" font-size="36" font-weight="900" font-family="monospace" fill="url(#textGrad)" letter-spacing="-1">
      OUTBID<tspan fill="#f59e0b">.</tspan>
    </text>
    <text x="80" y="60" font-size="14" font-weight="700" font-family="monospace" fill="#71717a" letter-spacing="1">
      BY <tspan fill="#f59e0b">INDIHUNT</tspan>
    </text>

    <!-- LIVE Pulse Pill -->
    <rect x="360" y="16" width="120" height="32" rx="16" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" />
    <circle cx="378" cy="32" r="5" fill="#10b981" />
    <text x="392" y="37" font-size="13" font-weight="800" fill="#34d399" font-family="monospace" letter-spacing="1">LIVE NOW</text>
  </g>

  <!-- Headline -->
  <text x="80" y="235" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    The Live Attention Marketplace
  </text>
  <text x="80" y="295" font-size="44" font-weight="800" fill="url(#brandGrad)" letter-spacing="-1">
    For Winning Products &amp; Startups
  </text>

  <!-- Subtitle -->
  <text x="80" y="355" font-size="22" font-weight="500" fill="#a1a1aa" width="650">
    Pick any category, claim the #1 spot, outbid competitors, and capture high-intent backlink traffic.
  </text>

  <!-- Stats Grid Cards -->
  <g transform="translate(80, 420)">
    <!-- Card 1: #1 Spot Rank -->
    <g transform="translate(0, 0)">
      <rect width="230" height="110" rx="18" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.5" />
      <text x="20" y="38" font-size="13" font-weight="700" fill="#71717a" font-family="monospace" letter-spacing="0.5">TOP POSITION</text>
      <text x="20" y="78" font-size="32" font-weight="900" fill="#f59e0b">#1 Spot</text>
      <text x="20" y="98" font-size="12" font-weight="600" fill="#10b981">✦ Maximum Attention</text>
    </g>

    <!-- Card 2: Live Outbidding -->
    <g transform="translate(260, 0)">
      <rect width="230" height="110" rx="18" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.5" />
      <text x="20" y="38" font-size="13" font-weight="700" fill="#71717a" font-family="monospace" letter-spacing="0.5">LEADERBOARDS</text>
      <text x="20" y="78" font-size="32" font-weight="900" fill="#ffffff">Real-Time</text>
      <text x="20" y="98" font-size="12" font-weight="600" fill="#a1a1aa">Instant Rank Shifts</text>
    </g>

    <!-- Card 3: Traffic & Backlinks -->
    <g transform="translate(520, 0)">
      <rect width="230" height="110" rx="18" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.5" />
      <text x="20" y="38" font-size="13" font-weight="700" fill="#71717a" font-family="monospace" letter-spacing="0.5">GROWTH ASSET</text>
      <text x="20" y="78" font-size="32" font-weight="900" fill="#34d399">Permanent</text>
      <text x="20" y="98" font-size="12" font-weight="600" fill="#34d399">High-DR Backlinks</text>
    </g>

    <!-- Card 4: Categories -->
    <g transform="translate(780, 0)">
      <rect width="260" height="110" rx="18" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.5" />
      <text x="20" y="38" font-size="13" font-weight="700" fill="#71717a" font-family="monospace" letter-spacing="0.5">MARKETPLACES</text>
      <text x="20" y="78" font-size="32" font-weight="900" fill="#fb7185">12+ Niches</text>
      <text x="20" y="98" font-size="12" font-weight="600" fill="#a1a1aa">AI, SaaS, Crypto &amp; More</text>
    </g>
  </g>
</svg>
